name: arise
description: Arise — AI-powered human development platform
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (manual providers — no codegen needed)
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Local storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  hive_flutter: ^1.1.0

  # UI utilities
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.7
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Codegen (freezed, riverpod_generator, build_runner) added in Phase 9
  # when needed extensively for models — deferred to avoid SDK version conflicts

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
